[package]
name = "mugon-sdk-ui-bevy"
version = "0.1.0"
edition = "2024"
description = "The Mugon platform's look and UI components for Bevy: theme, widgets and layout helpers."
license = "MIT"
repository = "https://github.com/mugon-net/mugon-sdk-ui-bevy"
readme = "README.md"
keywords = ["bevy", "gamedev", "ui", "wasm", "mugon"]
categories = ["game-development", "gui", "wasm"]
include = ["src/**/*", "examples/**/*", "README.md", "LICENSE-MIT", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true
targets = ["wasm32-unknown-unknown"]

[features]
# Nothing is on by default; each group of components is opt-in to keep wasm builds small.
default = []
overlays = []
inputs = []
game-ui = []
# Menu bar, splitter, tree and virtualized grid, for tools with panels.
tool-ui = []
panel-model = []
test-harness = []

[dependencies]
# Only what the UI needs. The `picking` umbrella feature is left out: it pulls in mesh and sprite picking.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_asset",
    "bevy_render",
    "bevy_window",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_feathers",
    "bevy_picking",
    "ui_picking",
    "bevy_input_focus",
    "custom_cursor",
    "scene",
] }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Screen", "MediaQueryList", "Document", "Element", "HtmlElement", "CssStyleDeclaration"] }

[dev-dependencies]
# What the examples need to open a window and draw.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_asset",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "webgl2",
    "keyboard",
    "mouse",
    "touch",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_feathers",
    "bevy_picking",
    "ui_picking",
    "bevy_input_focus",
    "custom_cursor",
    "scene",
] }

[[example]]
name = "gallery"
path = "examples/gallery.rs"
required-features = ["test-harness", "panel-model", "inputs", "overlays", "game-ui", "tool-ui"]
